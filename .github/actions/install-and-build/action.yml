name: Install dependencies & build packages
inputs:
  build:
    description: Whether to build packages (defaults to "true")
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Install Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        cache: npm
        node-version: 22

      # Remove pin once npm/cli#9151 is fixed
    - name: Install npm 11
      shell: bash
      run: npm install -g npm@11.11.1

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: npm run build
