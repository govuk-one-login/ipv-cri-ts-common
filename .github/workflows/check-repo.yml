name: Check repo

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Every Monday at 9am
    - cron: "0 9 * * 1"

permissions:
  id-token: write
  contents: read

concurrency:
  group: check-repo-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Run pre-commit
        uses: govuk-one-login/github-actions/code-quality/run-pre-commit@29b14fef4e6a98834b6f08ce3120d936b62748a6
        with:
          node-version: 22
          npm-version: 11
          install-dependencies: true
          run-build: true
          all-files: true

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      coverage-artifact-id: ${{ steps.upload-artifacts.outputs.artifact-id }}
    steps:
      - name: Run tests
        if: ${{ github.event_name == 'pull_request' }}
        uses: govuk-one-login/github-actions/node/run-script@cc6fa2aee0ba0d759bbb8ff8a3530cd228035b53
        with:
          fetch-depth: 0
          node-version: 22
          npm-version: 11
          run-build: true

      - name: Set the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Run unit tests on affected packages
        if: ${{ github.event_name == 'pull_request' }}
        run: npx nx affected -t test:coverage

      - name: Run unit tests on all packages
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run test:coverage

      - name: Fix lcov.info files
        run: ./scripts/fix-lcov.sh

      - name: Archive coverage results
        id: upload-artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}
          retention-days: 3
          path: packages/*/coverage/lcov.info
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    environment: integration-tests
    steps:
      - name: Run tests
        if: ${{ github.event_name == 'pull_request' }}
        uses: govuk-one-login/github-actions/node/run-script@cc6fa2aee0ba0d759bbb8ff8a3530cd228035b53
        with:
          fetch-depth: 0
          node-version: 22
          npm-version: 11
          run-build: true

      - name: Set the base and head SHAs for the nx affected commands in CI
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3

      - name: Assume AWS Role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Run integration tests
        env:
          SQS_QUEUE_URL: ${{ vars.SQS_QUEUE_URL }}
          TEST_HARNESS_EXECUTE_URL: ${{ vars.TEST_HARNESS_EXECUTE_URL }}
          AWS_REGION: eu-west-2
        run: STACK_IDENTIFIER=${GITHUB_SHA:0:8} npx nx affected -t test:integration

  sonarcloud:
    name: Sonarcloud
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Scan
        uses: govuk-one-login/github-actions/code-quality/sonarcloud@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          coverage-artifact:
            ${{ needs.unit-tests.outputs.coverage-artifact-id && format('coverage-{0}', github.run_id) || null }}
          coverage-run-id: ${{ github.run_id }}
          coverage-location: packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          pull-repository: "true"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Run CodeQL scan
        uses: govuk-one-login/github-actions/code-quality/codeql@b5f4f92a0692bf297b08c43745e545e45631f0ee
        with:
          languages: javascript-typescript
